<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoParts</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="./assets/css/output.css" rel="stylesheet">
    <!-- TODO add favicon-->
</head>
<body class="min-h-screen bg-white">
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16 md:h-20">
                <div class="flex-shrink-0">
                    <a href="#inicio" class="flex items-center gap-2">
                        <div class="w-10 h-10 md:w-12 md:h-12 bg-gradient-to-br from-blue-600 to-blue-800 rounded-lg flex items-center justify-center">
                            <span class="text-white">AP</span>
                        </div>
                        <div class="hidden sm:block">
                            <div class="text-gray-900">AutoParts</div>
                            <div class="text-xs text-gray-500">Import Solutions</div>
                        </div>
                    </a>
                </div>
            <!-- Desktop Navigation  -->
                <div class="hidden md:flex items-center gap-8">
                    <a  href="#inicio" class="text-gray-700 hover:text-blue-600 transition-colors">Inicio</a>
                    <a  href="#quienes-somos" class="text-gray-700 hover:text-blue-600 transition-colors">Quiénes Somos</a>
                    <a  href="#productos" class="text-gray-700 hover:text-blue-600 transition-colors">Productos</a>
                    <a  href="#servicios" class="text-gray-700 hover:text-blue-600 transition-colors">Servicios</a>
                    <a  href="#contacto" class="text-gray-700 hover:text-blue-600 transition-colors">Contacto</a>
                </div>
                <div class="hidden md:block">
                    <!-- Whatsapp button -->
                    <a
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="flex items-center gap-2 px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors">
                        <i data-lucide="message-circle" class="text-black-500 w-8 h-8"></i>
                        <span>Contáctanos por WhatsApp</span>
                    </a>
                </div>

            </div>
        </nav>
        
    </header>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
